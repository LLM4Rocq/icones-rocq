name: Deploy Blueprint

# The blueprint build is a SEPARATE workflow from the main Rocq build
# (build.yml). It is kept NON-BLOCKING by simply not making it a
# required status check in branch protection — NOT by hiding failures.
# A failing blueprint build therefore turns this workflow (and its
# badge) red, which is the honest signal, while still never blocking a
# merge. Only the best-effort coqdoc job below keeps
# `continue-on-error: true` (a missing coqdoc page is cosmetic); the
# blueprint web build and the Pages deploy fail loudly.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Required by every `dawidd6/action-download-artifact` step below: reading
  # another run's (or another workflow's) artefact list goes through the
  # Actions API. Because this workflow declares an explicit `permissions:`
  # block, any scope not listed here is `none`.
  actions: read

concurrency:
  group: pages
  # Supersede a queued/stuck run instead of piling up behind it: overlapping
  # pushes under cancel-in-progress:false serialized their Pages deployments,
  # and one hung in "deployment_queued" until the deploy-pages timeout.
  cancel-in-progress: true

jobs:
  build-docs:
    # Gate coqdoc on the blueprint web build: if the blueprint fails
    # there is no point spending the (slow) Rocq toolchain install on
    # coqdoc, nor deploying. coqdoc itself stays best-effort.
    needs: build-blueprint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: coq-community/docker-coq-action@v1
        with:
          opam_file: icones.opam
          coq_version: '9.1.1'
          ocaml_version: 'default'
          before_script: |
            startGroup "Workaround permission issue"
              sudo chown -R 1000:1000 .
            endGroup
          # The full Rocq build of this project is non-trivial; the
          # blueprint links into coqdoc HTML for cross-refs. We build
          # whatever compiles within the runner budget; missing pages
          # render as plain anchors in the blueprint.
          after_script: |
            startGroup "Build coqdoc (best effort)"
              if ! command -v rocq >/dev/null 2>&1 ; then
                coq_makefile -f _CoqProject -o Makefile.doc
              else
                rocq makefile -f _CoqProject -o Makefile.doc
              fi
              mkdir -p html
              make -f Makefile.doc html || true
            endGroup
            sudo chown -R $(id -u):$(id -g) html/ || true

      - name: Revert permissions
        if: ${{ always() }}
        run: sudo chown -R 1001:116 . || true

      - name: Upload coqdoc artifact
        uses: actions/upload-artifact@v4
        with:
          name: coqdoc-html
          path: html/
          if-no-files-found: ignore

  build-auditor:
    # Build the paper-to-Rocq auditor dashboard from docs/PAPER.md +
    # docs/PPL.md + docs/EXAMPLES.md (the triple-tab dashboard).
    # This job runs in parallel with build-blueprint; it fails loudly on
    # its own errors but its artefact is best-effort consumed by
    # combine-and-deploy (so a parser regression doesn't block the
    # Pages deploy).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-auditor-${{ hashFiles('tools/auditor/requirements.txt') }}

      - name: Install Python dependencies
        run: pip install -r tools/auditor/requirements.txt

      # -- real dependency-graph data -----------------------------------
      # The graph's load-bearing `depends` edges come from the `.glob` files
      # `coqc` emits, which are .gitignore'd and which this job (a pure
      # Python build) never produces. `build.yml` compiles the formalisation
      # anyway and publishes them as `theories-glob`; we reuse that instead
      # of adding a ~15 min Rocq build to the deploy critical path.
      #
      # PINNED TO THIS COMMIT. The `.glob` data is not decoration: it drives
      # byte-offset-based statement extraction in tools/auditor/snippets.py
      # as well as the graph edges, so a `.glob` describing a DIFFERENT
      # revision of theories/ is a wrong input, not merely an old one. The
      # earlier `branch: main` form never looked at the current run at all —
      # it always resolved to the newest successful build.yml run on main, so
      # every push was graded against a stale proof structure and a PR was
      # graded against main's. `build.yml` runs on both `push` and
      # `pull_request`, so this SHA does get its own artefact; this step just
      # has to wait for it (build.yml ~15 min vs this job ~5 min, hence the
      # explicitly-labelled fallback below).
      - name: Fetch Rocq .glob files (pinned to this commit)
        id: glob_pinned
        uses: dawidd6/action-download-artifact@v6
        with:
          name: theories-glob
          path: .
          workflow: build.yml
          workflow_conclusion: success
          # `github.sha` on a pull_request event is the ephemeral merge
          # commit, which build.yml never uploaded an artefact for; the PR
          # head SHA is the one it actually built.
          commit: ${{ github.event.pull_request.head.sha || github.sha }}
          # `fail` (not `warn`) on purpose: it is what lets the fallback step
          # below detect that nothing was downloaded.
          if_no_artifact_found: fail
          search_artifacts: true
        continue-on-error: true

      # Explicitly separate, explicitly named: if this step runs, the build is
      # being graded against a DIFFERENT commit's proof structure. That is a
      # deliberate trade (build.yml is slower than this job, so on a fresh
      # push the pinned artefact does not exist yet) but it must never be
      # mistaken for the pinned fetch — hence its own name, its own warning,
      # and the provenance line recorded for the build log.
      - name: Fetch Rocq .glob files (FALLBACK — last successful main build, NOT this commit)
        id: glob_fallback
        if: steps.glob_pinned.outcome != 'success'
        uses: dawidd6/action-download-artifact@v6
        with:
          name: theories-glob
          path: .
          workflow: build.yml
          workflow_conclusion: success
          branch: main
          if_no_artifact_found: warn
          search_artifacts: true
        continue-on-error: true

      - name: Unpack Rocq .glob files
        run: |
          if [ "${{ steps.glob_pinned.outcome }}" = "success" ]; then
            echo "glob provenance: this commit (${{ github.event.pull_request.head.sha || github.sha }})"
          elif [ -f theories-glob.tar.gz ]; then
            echo "::warning::theories-glob for this commit was not available (build.yml has not finished for it); fell back to the last successful build on main. The dependency graph and the live-snippet extraction describe a DIFFERENT revision of theories/ than this checkout."
          fi
          if [ -f theories-glob.tar.gz ]; then
            tar -xzf theories-glob.tar.gz
            rm -f theories-glob.tar.gz
          else
            echo "::warning::theories-glob artefact not found at all; the dependency graph will have no real .glob edges. The site still builds (behind the graph page's explicit 'Degraded' banner) and still deploys; the guard step below turns this JOB red."
          fi
          echo "glob files present: $(find theories -name '*.glob' | wc -l)"

      - name: Run parser tests
        # Runs AFTER the .glob fetch on purpose: the graph tests that assert
        # a substantial, real dependency relation over the live docs skip
        # themselves when no .glob is present, so running them earlier would
        # quietly test nothing.
        run: pytest tools/auditor/tests/ -v

      - name: Check live snippets
        # Every fenced `coq` block on the dashboard is resolved from
        # theories/**/*.v at build time (tools/auditor/snippets.py), so the
        # cards show the sources rather than a hand-maintained paste.  This
        # step is the maintenance dashboard for that mechanism: it lists
        # declarations that could not be resolved (a renamed / moved lemma),
        # pastes that disagree with the source, and wrong provenance
        # comments.  It runs WITHOUT compiling the theories (a pure text
        # scan), and is non-blocking: a stale paste must never stop the
        # Pages deploy — the build falls back to the pasted text for
        # anything it cannot resolve.  Every held-back splice is additionally
        # emitted as a `::warning::` annotation, so the signal is visible on
        # the run summary of a GREEN build rather than buried in a log nobody
        # opens.
        continue-on-error: true
        run: python -m tools.auditor.snippets

      - name: Build auditor dashboard
        env:
          # LENIENT here, ON PURPOSE — the strict check runs as its own step
          # after the upload below.  Raising mid-build made the entire Pages
          # publish (blueprint and coqdoc included, since `combine-and-deploy`
          # is the only job that downloads them) hostage to another
          # workflow's artefact: a red `build.yml`, an expired
          # `theories-glob` or an Actions-API hiccup skipped the deploy
          # outright.  Instead we build the degraded graph — which
          # `templates/graph.html` already labels with an explicit
          # "Degraded: no .glob data was available for this build" banner,
          # so nothing is claimed that is not true — publish it, and then
          # fail this JOB's status.
          AUDITOR_REQUIRE_GLOB_DEPS: '0'
        run: |
          # The Pagefind search index is built in-process by
          # build_auditor.py via the `pagefind[extended]` Python package
          # (pinned in tools/auditor/requirements.txt and installed in the
          # "Install Python dependencies" step above), so no standalone
          # pagefind binary or separate `pagefind --site` step is needed —
          # this also avoids version drift between the pinned pip package
          # and a curled release binary.
          # --strict aborts on the first warning, which today includes
          # auto-resolved duplicate-slug warnings — those are
          # informational, not errors. Run without --strict and treat
          # warnings as a soft signal.
          python tools/build_auditor.py \
            --paper    docs/PAPER.md \
            --ppl      docs/PPL.md \
            --examples docs/EXAMPLES.md \
            --out      site/auditor/ \
            --coqproject _CoqProject \
            --github-repo "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"

      - name: Upload auditor artifact
        uses: actions/upload-artifact@v4
        with:
          name: auditor-site
          path: site/auditor/
          if-no-files-found: error

      # The strict guard, moved AFTER the upload so that failing it turns
      # this job (and the workflow badge) red — the honest signal — without
      # withholding the artefact that `combine-and-deploy` needs.  That job
      # runs on `always()` and re-checks the artefact itself, so a degraded
      # graph costs a red badge, not the whole site publish.
      - name: Guard — the graph must carry real .glob dependency edges
        run: python -m tools.auditor.render --check-graph site/auditor/graph.json

  build-blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            graphviz libgraphviz-dev \
            texlive-latex-base texlive-latex-extra \
            texlive-xetex texlive-fonts-extra \
            latexmk

      - name: Install rocqblueprint
        run: pip install rocqblueprint

      # Do NOT mask the web build with `|| true`: a failure must be
      # visible. This job is NOT continue-on-error, so a failure here
      # shows the workflow red and skips coqdoc + the Pages deploy — yet
      # never blocks a PR, because this check is simply not required.
      - name: Build blueprint (web)
        run: rocqblueprint web

      - name: Build blueprint (pdf, best-effort)
        run: rocqblueprint pdf || true

      - name: Stage site
        run: |
          mkdir -p site
          # Fail loudly rather than deploying an empty /blueprint/ (which
          # would 404). The web build above must have produced blueprint/web.
          test -d blueprint/web
          cp -r blueprint/web site/blueprint
          if [ -f blueprint/print/print.pdf ]; then
            cp blueprint/print/print.pdf site/blueprint.pdf
          fi

      - name: Upload blueprint artifact
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-site
          path: site/
          if-no-files-found: ignore

  combine-and-deploy:
    # Gated on `build-auditor` ONLY.  The (slow) `build-blueprint` and
    # `build-docs` jobs are NOT in the needs-list, so the auditor
    # deploys as soon as its own short job finishes (~5 min) instead
    # of waiting on the LaTeX build + Rocq toolchain install (~15 min
    # together).  Blueprint and coqdoc artefacts are fetched best-
    # effort from this run if they happen to be ready in time, falling
    # back to the most recent successful build on `main` (via
    # `dawidd6/action-download-artifact`) so that `/blueprint/` and
    # `/docs/` don't 404 between deploys.  If the slow builds finish
    # AFTER this deploy, their fresh content lands on the next push
    # that triggers the workflow.
    #
    # `always()` (plus an explicit cancellation check): a RED `build-auditor`
    # must not take `/blueprint/` and `/docs/` down with it.  This is the only
    # job that publishes them, so gating it on another job's success meant a
    # degraded graph, an expired `theories-glob`, or `actions: read` being
    # denied on a fork PR unpublished the entire site.  Every artefact below
    # is fetched defensively and the assembled site is verified before it is
    # deployed, so a failure upstream degrades to "last known good", never to
    # a 404.
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.build-auditor.result != 'cancelled'
    needs: [build-auditor]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download blueprint (this run if ready, else last successful)
        uses: dawidd6/action-download-artifact@v6
        with:
          name: blueprint-site
          path: site/
          workflow: blueprint.yml
          workflow_conclusion: success
          if_no_artifact_found: warn
          search_artifacts: true
        continue-on-error: true

      - name: Download coqdoc (this run if ready, else last successful)
        uses: dawidd6/action-download-artifact@v6
        with:
          name: coqdoc-html
          path: site/docs/
          workflow: blueprint.yml
          workflow_conclusion: success
          if_no_artifact_found: warn
          search_artifacts: true
        continue-on-error: true

      - name: Download auditor (fresh, from this run)
        id: auditor_fresh
        uses: actions/download-artifact@v4
        with:
          name: auditor-site
          path: site/auditor/
        continue-on-error: true

      - name: Download auditor (FALLBACK — last successful build on main)
        if: steps.auditor_fresh.outcome != 'success'
        uses: dawidd6/action-download-artifact@v6
        with:
          name: auditor-site
          path: site/auditor/
          workflow: blueprint.yml
          workflow_conclusion: success
          branch: main
          if_no_artifact_found: warn
          search_artifacts: true
        continue-on-error: true

      # The one hard requirement of this job: never publish a site whose
      # /auditor/ is missing (that would 404 the dashboard the whole deploy
      # exists for).  Both downloads above are best-effort; this is where a
      # genuinely broken build stops.
      - name: Verify the assembled site
        run: |
          if [ "${{ steps.auditor_fresh.outcome }}" != "success" ]; then
            echo "::warning::this run's auditor artefact was unavailable (build-auditor failed?); deploying the last successful build's dashboard instead."
          fi
          test -f site/auditor/index.html \
            || { echo "::error::no auditor dashboard to deploy (neither this run's artefact nor a previous successful one)"; exit 1; }
          test -d site/blueprint || echo "::warning::no blueprint/ in the assembled site"
          echo "site contents:"; ls -la site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 20 min (default 10): the grounded site + vendored MathJax is ~19 MB
          # and the Pages backend can sit in "deployment_queued" under load.
          timeout: 1200000
