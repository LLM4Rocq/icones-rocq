name: Build

# Gating CI for the Rocq formalisation: a clean `make` plus the MVP
# axiom check (`verify.sh`). Unlike the blueprint workflow, this one
# is NOT best-effort — a failure here means the formalisation does
# not compile or the MVP headline picked up an unexpected axiom.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cheap and fast, so it runs BEFORE the (slow) Rocq toolchain install:
      # a layering violation is a design regression that `make` would happily
      # compile, so nothing downstream would catch it.
      - name: Check the import layering
        run: python3 tools/check_layers.py

      - uses: coq-community/docker-coq-action@v1
        with:
          opam_file: icones.opam
          coq_version: '9.1.1'
          ocaml_version: 'default'
          before_script: |
            startGroup "Workaround permission issue"
              sudo chown -R 1000:1000 .
            endGroup
          script: |
            startGroup "Build the formalisation"
              make -j2
            endGroup
            startGroup "Check the MVP axiom budget"
              # verify.sh clean-rebuilds and Print Assumptions the headline
              # theorem Skern_to_ICones_fully_faithful (paper Thm 6.5).
              ./verify.sh
            endGroup

      - name: Revert permissions
        if: ${{ always() }}
        run: sudo chown -R $(id -u):$(id -g) . || true

      # This is the ONLY job in the repo that compiles the formalisation, so
      # it is also the cheapest place to harvest the `.glob` files `coqc`
      # emits next to every `.v`. They carry the real proof-level dependency
      # relation (which lemma's proof uses which), which the auditor's
      # dependency graph needs to draw REAL `depends` edges instead of
      # degrading to doc word-overlap — see blueprint.yml's `build-auditor`,
      # which downloads this artefact rather than paying for a second Rocq
      # build on the deploy critical path.
      #
      # Neither step carries `if: always()`: on a failed/partial `make` the
      # `.glob` tree is incomplete, and half a dependency graph published as
      # if it were whole is exactly the silent degradation we are closing.
      # A single tarball keeps the artefact's internal paths verbatim
      # (`theories/<dir>/<file>.glob`), independent of upload-artifact's
      # least-common-ancestor rooting.
      - name: Package Rocq .glob files
        run: |
          count=$(find theories -name '*.glob' | wc -l)
          echo "found $count .glob file(s)"
          if [ "$count" -eq 0 ]; then
            echo "::error::the build succeeded but emitted no .glob files; the auditor dependency graph would have no real edges"
            exit 1
          fi
          find theories -name '*.glob' -print0 \
            | tar --null -czf theories-glob.tar.gz --files-from -

      - name: Upload Rocq .glob files
        uses: actions/upload-artifact@v4
        with:
          name: theories-glob
          path: theories-glob.tar.gz
          if-no-files-found: error
          # Long retention on purpose: blueprint.yml falls back to the most
          # recent *successful* main build when this run's artefact is not
          # ready yet, so an expired artefact would strand the auditor build
          # during a quiet period on main.
          retention-days: 90
